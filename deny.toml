# cargo-deny dependency policy: advisories / licenses / bans / sources (`just deny`).
# Docs: https://embarkstudios.github.io/cargo-deny/
[graph]
# Match the targets in dist-workspace.toml; ignore GPUI's unused mobile/web branches.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
yanked = "deny"
# Precise, reasoned exceptions for unmaintained upstream crates. These are
# maintenance notices, not vulnerability advisories: every one of them is
# pinned inside GPUI/Kits' own dependency graph and cannot be upgraded from
# this workspace. Ignoring an ID only silences that specific advisory — any
# new advisory (including a vulnerability) raised against the same crate still
# fails the gate. `just deny`'s `-D advisory-not-detected` is the fuse: when
# the affected crate leaves the graph or the advisory stops being reported,
# CI fails and the entry must be deleted in that same PR.
ignore = [
  { id = "RUSTSEC-2024-0384", reason = "instant 0.1.13 is pulled in by gpui-base/gpui-component; replacing it with web-time requires an upstream GPUI change" },
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is used only for gpui-component's macro expansion; switching to the pastey fork is an upstream decision" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 arrives through fontdb/usvg in GPUI's text stack; migrating to skrifa is upstream work" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz 0.20.1 is pinned by GPUI's usvg/resvg 0.45 and 0.46; migrating to harfrust is upstream work" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5.15.1 belongs to the zbus 5 D-Bus stack used by Linux accessibility and ashpd; moving to zbus 6 is an upstream upgrade" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.5 belongs to the zbus 5 D-Bus stack used by Linux accessibility and ashpd; moving to zbus 6 is an upstream upgrade" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.15.1 belongs to the zbus 5 D-Bus stack used by Linux accessibility and ashpd; moving to zbus 6 is an upstream upgrade" },
  { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 is pinned throughout GPUI's dependency graph; this INFO-only unmaintained exemption ends when GPUI migrates to jiff/time or chrono resumes maintenance" },
]

[bans]
# New duplicate versions fail the check. The current exceptions are forced by
# third-party dependencies and cannot be unified from this workspace; just deny
# also denies unmatched/unnecessary skips, so each exception must be removed as
# soon as the duplicate disappears.
multiple-versions = "deny"
highlight = "all"
skip = [
  { crate = "syn", version = "2", reason = "miette-derive and tracing-attributes still require syn 2 while other derive dependencies use syn 3" },
  { crate = "unicode-width", version = "0.1", reason = "miette requires unicode-width 0.1 while its textwrap dependency uses 0.2" },
  { crate = "base64@0.22.1", reason = "GPUI's pinned resvg/reqwest stack uses 0.22 while rust-i18n uses 0.23" },
  { crate = "bitflags@1.3.2", reason = "GPUI's LSP, rust-i18n and PNG stack still use 1.x while platform crates use 2.x" },
  { crate = "bit-set@0.11.1", reason = "GPUI test-support's proptest uses bit-set 0.11 while wgpu/naga uses 0.10" },
  { crate = "bit-vec@0.10.2", reason = "GPUI test-support's proptest uses bit-vec 0.10 while wgpu/naga uses 0.9" },
  { crate = "block-buffer@0.10.4", reason = "GPUI platform crypto dependencies use digest 0.10 alongside newer 0.11" },
  { crate = "convert_case@0.11.0", reason = "GPUI test-support's proptest macros use convert_case 0.11 while derive_more uses 0.10" },
  { crate = "cpufeatures@0.2.17", reason = "GPUI platform crypto dependencies span sha2 0.10 and 0.11" },
  { crate = "crypto-common@0.1.7", reason = "GPUI platform crypto dependencies span digest 0.10 and 0.11" },
  { crate = "digest@0.10.7", reason = "GPUI platform crypto dependencies require 0.10 alongside 0.11" },
  { crate = "dirs@5.0.1", reason = "GPUI font support uses dirs 5 while embedded assets use dirs 6" },
  { crate = "dirs-sys@0.4.1", reason = "GPUI font support uses dirs-sys 0.4 while embedded assets use 0.5" },
  { crate = "font-types@0.11.3", reason = "GPUI font stack currently spans read-fonts 0.37 and 0.41" },
  { crate = "getrandom@0.2.17", reason = "GPUI XIM's const-random stack requires 0.2 alongside newer platform dependencies" },
  { crate = "getrandom@0.3.4", reason = "GPUI rand 0.9 stack uses 0.3 alongside accessibility stack 0.4" },
  { crate = "gif@0.13.3", reason = "GPUI Component resvg uses 0.13 while GPUI image stack uses 0.14" },
  { crate = "hashbrown@0.14.5", reason = "GPUI XIM pins 0.14 alongside accessibility and newer collections stacks" },
  { crate = "hashbrown@0.16.1", reason = "GPUI accessibility and wgpu allocator use 0.16 alongside Kit's collections 0.17" },
  { crate = "heck@0.4.1", reason = "GPUI Apple build tooling uses heck 0.4 while other macros use 0.5" },
  { crate = "imagesize@0.13.0", reason = "GPUI Component resvg uses 0.13 alongside GPUI's usvg 0.14" },
  { crate = "itertools@0.11.0", reason = "GPUI localization uses itertools 0.11 alongside 0.13 and 0.14" },
  { crate = "itertools@0.13.0", reason = "GPUI Base uses itertools 0.13 while its pinned GPUI snapshot uses 0.14" },
  { crate = "kurbo@0.11.3", reason = "GPUI Component's resvg stack pins kurbo 0.11" },
  { crate = "miniz_oxide@0.8.9", reason = "GPUI image decoder exr uses 0.8 alongside newer compression users" },
  { crate = "objc2@0.5.3", reason = "GPUI macOS dependencies span objc2 0.5 and 0.6" },
  { crate = "objc2-app-kit@0.2.2", reason = "GPUI macOS dependencies span objc2-app-kit 0.2 and 0.3" },
  { crate = "objc2-foundation@0.2.2", reason = "GPUI macOS dependencies span objc2-foundation 0.2 and 0.3" },
  { crate = "phf@0.11.3", reason = "GPUI font and syntax crates use phf 0.11 alongside 0.13" },
  { crate = "phf_generator@0.11.3", reason = "GPUI font and syntax crates use phf_generator 0.11 alongside 0.13" },
  { crate = "phf_shared@0.11.3", reason = "GPUI font and syntax crates use phf_shared 0.11 alongside 0.13" },
  { crate = "png@0.17.16", reason = "GPUI resvg uses png 0.17 alongside current image stack" },
  { crate = "pollster@0.2.5", reason = "GPUI test-support's postage uses pollster 0.2 while the GPUI executor uses 0.4" },
  { crate = "quick-error@1.2.3", reason = "GPUI test-support's rusty-fork uses quick-error 1 while image-webp uses 2" },
  { crate = "rand@0.8.8", reason = "GPUI platform dependencies require rand 0.8 and 0.9" },
  { crate = "rand@0.10.4", reason = "GPUI test-support's proptest uses rand 0.10 alongside the existing 0.9 stack" },
  { crate = "rand_core@0.6.4", reason = "GPUI platform dependencies require rand_core 0.6 and 0.9" },
