# cargo-nextest config SSOT (nextest reads this file automatically; the CLI
# must not repeat these parameters)
[profile.default]
# one failing test does not cancel the rest — the full failure picture beats a fast exit
fail-fast = false
# slow-test guardrail: kill on timeout so a hanging test cannot stall CI
slow-timeout = { period = "30s", terminate-after = 3 }

# The opt-in real-model test has two model turns and internal deadlines longer
# than the default guardrail. Keep the outer budget above those diagnostics.
[[profile.default.overrides]]
filter = "test(real_model_prompt_retry_streams_persists_and_cancels)"
slow-timeout = { period = "60s", terminate-after = 10 }
