# Native GUI acceptance stays outside PR checks because a cold Docker build is
# slow. Run nightly and on demand; screenshots and logs are kept for seven days.
name: native Editor

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *" # Daily at 03:23 UTC

permissions:
  contents: read

jobs:
  native-editor:
    name: native Editor (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: just
      - run: just native-editor-smoke-ubuntu
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-editor-smoke-ubuntu
          path: |
            target/native-editor-smoke/ubuntu-24.04/*.bmp
            target/native-editor-smoke/ubuntu-24.04/*.json
            target/native-editor-smoke/ubuntu-24.04/*.log
          retention-days: 7
