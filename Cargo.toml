# ============================================================================
# The root Cargo.toml is this repository's three-in-one SSOT:
#   1. [workspace.dependencies] — third-party versions live ONLY here; member
#      crates inherit via workspace = true (they may only add features/optional);
#   2. [workspace.package]      — version, edition, license, ... declared once;
#   3. [workspace.lints]        — lint policy declared once; members inherit via
#      [lints] workspace = true, CI escalates it to hard errors with -D warnings.
# ============================================================================
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/duskgrow/metis"

[workspace.dependencies]
# ---- runtime dependencies ----
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
  "sink",
] }
gpui-kit = { version = "0.10.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
  "net",
] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
] }
thiserror = "2"
# the `fancy` renderer may only appear in the final binary (top-level crate);
# library crates should depend on plain miette instead
miette = { version = "7", features = ["fancy"] }
nix = { version = "0.31.4", default-features = false, features = ["signal"] }
# process-wrap is pinned to the upstream commit containing the JobObject wait fix
# until that fix reaches a crates.io release; remove the deny.toml source exception
# together with this pin when switching back.
process-wrap = { git = "https://github.com/watchexec/process-wrap", rev = "ccb58857b0bad6e3d8b85b7c9041bd407aa4cd1b", default-features = false, features = [
  "std",
  "process-group",
  "job-object",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ---- dev dependencies ----
insta = "1"
assert_cmd = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic rules whose noise outweighs their value for a bin + internal-lib shape:
missing_errors_doc = "allow" # error docs are carried by miette Diagnostic (code/help)
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# release artifacts are built cross-platform by cargo-dist; give distributed
# binaries a solid optimization level
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
