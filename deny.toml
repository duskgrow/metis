# cargo-deny dependency policy: advisories / licenses / bans / sources (`just deny`).
# Docs: https://embarkstudios.github.io/cargo-deny/
[advisories]
yanked = "deny"
# Every ignore is temporary and carries its removal trigger in a comment; the
# fuse is `just deny`'s `-D advisory-not-detected`, which fails CI once the
# advisory no longer matches any crate in the tree — the dependency-update PR
# that clears the condition is the one that must delete the entry.
ignore = []

[bans]
# New duplicate versions fail the check. The current exceptions are forced by
# third-party dependencies and cannot be unified from this workspace; just deny
# also denies unmatched/unnecessary skips, so each exception must be removed as
# soon as the duplicate disappears.
multiple-versions = "deny"
highlight = "all"
skip = [
  { crate = "syn", version = "2", reason = "miette-derive and tracing-attributes still require syn 2 while other derive dependencies use syn 3" },
  { crate = "unicode-width", version = "0.1", reason = "miette requires unicode-width 0.1 while its textwrap dependency uses 0.2" },
]

[licenses]
# A new dependency's license must already be on this list; extending the list
# requires a discussion in the PR first. Prefer a per-crate exception below
# over widening this global list. The list is pre-authorization, not a claim
# about the current tree: an entry no crate currently uses is not a defect.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "Unicode-3.0",
  "0BSD",
]
# Per-crate exceptions: the license is allowed ONLY for the named crate, so a
# new crate arriving under the same license still trips the gate. The fuse is
# `just deny`'s `-D license-exception-not-encountered`: when the named crate
# leaves the dependency tree, CI fails and the entry must be deleted in that
# same PR.
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
