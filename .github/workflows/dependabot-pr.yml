# Dependabot has no PR-body template setting. Squash merge uses the title and
# body as the landed commit, so normalize newly opened bot PRs before review.
# pull_request_target grants write access to bot PRs. Checkout resolves the base
# repository here; never check out or execute the PR head in this workflow.
name: Dependabot PR body

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  normalize:
    name: normalize Dependabot body
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: just
      - env:
          GH_TOKEN: ${{ github.token }}
        run: just normalize-dependabot-pr
