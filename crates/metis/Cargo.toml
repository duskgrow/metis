[package]
name = "metis"
# shown in --help and on crates.io
description = "A personal multi-host agent workbench for continuing sessions, jobs, and approvals across devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["workbench"]
workbench = [
  "dep:gpui-kit",
  "gpui-kit/component",
  "gpui-kit/assets",
  "gpui-kit/tree-sitter-languages",
]

# the GitHub Release body is generated from this changelog's matching section
# (module-grouped per the [changelog] config in release-plz.toml)
[package.metadata.dist]
changelog = "../../CHANGELOG.md"

[dependencies]
clap.workspace = true
futures-util.workspace = true
gpui-kit = { workspace = true, optional = true }
reqwest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
miette.workspace = true
process-wrap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
insta.workspace = true
assert_cmd.workspace = true
