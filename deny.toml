  { crate = "thiserror@1.0.69", reason = "GPUI upstream snapshot uses thiserror 1 while Kit uses 2" },
  { crate = "thiserror-impl@1.0.69", reason = "GPUI upstream snapshot uses thiserror-impl 1 while Kit uses 2" },
  { crate = "toml@0.8.23", reason = "GPUI dependencies span TOML 0.8 and 1.x" },
  { crate = "toml_datetime@0.6.11", reason = "GPUI dependencies span toml_datetime 0.6 and 1.x" },
  { crate = "toml_edit@0.22.27", reason = "GPUI dependencies span toml_edit 0.22 and 0.25" },
  { crate = "usvg@0.45.1", reason = "GPUI Component pins usvg 0.45 while GPUI pins 0.46" },
  { crate = "windows@0.57.0", reason = "wgpu's gpu-allocator uses windows 0.57 alongside the GPUI 0.58 and 0.62 stacks" },
  { crate = "windows@0.58.0", reason = "GPUI Windows platform stack spans windows 0.58 and 0.62" },
  { crate = "windows-core@0.57.0", reason = "wgpu's gpu-allocator uses windows-core 0.57 alongside the GPUI 0.58 and 0.62 stacks" },
  { crate = "windows-core@0.58.0", reason = "GPUI Windows platform stack spans windows-core 0.58 and 0.62" },
  { crate = "windows-implement@0.57.0", reason = "wgpu's gpu-allocator uses windows-implement 0.57 alongside the GPUI 0.58 and 0.60 stacks" },
  { crate = "windows-implement@0.58.0", reason = "GPUI Windows platform stack spans windows-implement 0.58 and 0.60" },
  { crate = "windows-interface@0.57.0", reason = "wgpu's gpu-allocator uses windows-interface 0.57 alongside the GPUI 0.58 and 0.59 stacks" },
  { crate = "windows-interface@0.58.0", reason = "GPUI Windows platform stack spans windows-interface 0.58 and 0.59" },
  { crate = "windows-result@0.1.2", reason = "wgpu's gpu-allocator uses windows-result 0.1 alongside the existing 0.2 and 0.4 stacks" },
  { crate = "windows-result@0.2.0", reason = "GPUI Windows dependencies span windows-result 0.2 and 0.4" },
  { crate = "windows-strings@0.1.0", reason = "GPUI Windows dependencies span windows-strings 0.1 and 0.5" },
  { crate = "windows-sys@0.48.0", reason = "GPUI Windows dependencies span windows-sys 0.48 and 0.61" },
  { crate = "windows-sys@0.52.0", reason = "rustix uses windows-sys 0.52 alongside current 0.61 dependencies" },
  { crate = "windows-targets@0.48.5", reason = "GPUI Windows dependencies span windows-targets 0.48 and 0.52" },
  { crate = "windows_x86_64_gnu@0.48.5", reason = "GPUI Windows GNU target crates span versions 0.48 and 0.52" },
  { crate = "windows_x86_64_msvc@0.48.5", reason = "GPUI Windows MSVC target crates span versions 0.48 and 0.52" },
  { crate = "winnow@0.7.15", reason = "GPUI TOML dependencies span winnow 0.7 and 1.x" },
  { crate = "zbus@5.19.0", reason = "GPUI Linux accessibility uses zbus 5 while notifications use zbus 6" },
  { crate = "zbus_macros@5.19.0", reason = "GPUI Linux accessibility uses zbus macros 5 alongside notification stack 6" },
  { crate = "zune-core@0.4.12", reason = "GPUI image decoder stack spans zune-core 0.4 and 0.5" },
  { crate = "zune-jpeg@0.4.21", reason = "GPUI image decoder stack spans zune-jpeg 0.4 and 0.5" },
]

[licenses]
# A new dependency's license must already be on this list; extending the list
# requires a discussion in the PR first. Prefer a per-crate exception below
# over widening this global list. The list is pre-authorization, not a claim
# about the current tree: an entry no crate currently uses is not a defect.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "Unicode-3.0",
  "0BSD",
]
# Per-crate exceptions: the license is allowed ONLY for the named crate, so a
# new crate arriving under the same license still trips the gate. The fuse is
# `just deny`'s `-D license-exception-not-encountered`: when the named crate
# leaves the dependency tree, CI fails and the entry must be deleted in that
# same PR. These crates are pulled in by GPUI's rendering, platform, font,
# and asset dependencies; remove each exception when its crate leaves the tree.
exceptions = [
  { name = "arrayref", allow = ["BSD-2-Clause"] },
  { name = "encoding_rs", allow = ["BSD-3-Clause"] },
  { name = "exr", allow = ["BSD-3-Clause"] },
  { name = "instant", allow = ["BSD-3-Clause"] },
  { name = "lebe", allow = ["BSD-3-Clause"] },
  { name = "foldhash", allow = ["Zlib"] },
  { name = "notify", allow = ["CC0-1.0"] },
  { name = "sha1_smol", allow = ["BSD-3-Clause"] },
  { name = "subtle", allow = ["BSD-3-Clause"] },
  { name = "tiny-skia", allow = ["BSD-3-Clause"] },
  { name = "tiny-skia-path", allow = ["BSD-3-Clause"] },
  { name = "slotmap", allow = ["Zlib"] },
  { name = "tiny-keccak", allow = ["CC0-1.0"] },
  { name = "cbindgen", allow = ["MPL-2.0"] },
  { name = "dwrote", allow = ["MPL-2.0"] },
  { name = "option-ext", allow = ["MPL-2.0"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Temporary source exception for the pinned process-wrap JobObject wait fix;
# remove it together with the git pin in Cargo.toml.
allow-git = ["https://github.com/watchexec/process-wrap"]
required-git-spec = "rev"
